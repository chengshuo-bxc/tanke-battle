<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>坦克大战 · Battle City</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0f0f1a;display:flex;justify-content:center;align-items:center;
  min-height:100vh;font-family:'Segoe UI','Microsoft YaHei',sans-serif;
  overflow:hidden;user-select:none;
}
.game-wrapper{display:flex;flex-direction:column;align-items:center;gap:6px}
.header{
  display:flex;justify-content:space-between;align-items:center;
  width:780px;padding:0 10px;
}
.header h1{
  font-size:18px;font-weight:800;
  background:linear-gradient(135deg,#e94560,#f5c842);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.stats{display:flex;gap:20px;color:#fff;font-size:13px}
.stats .stat{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.06);padding:3px 10px;border-radius:5px}
.stats .stat .v{color:#f5c842;font-weight:bold;font-size:16px;min-width:24px;text-align:center}
.stats .stat .l{color:#888;font-size:11px}
canvas{
  display:block;border:2px solid rgba(233,69,96,0.4);border-radius:4px;
  background:#111;cursor:crosshair;
}
.game-container{position:relative}
.overlay{
  position:absolute;top:0;left:0;right:0;bottom:0;z-index:10;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  background:rgba(0,0,0,0.8);opacity:0;pointer-events:none;
  transition:opacity 0.3s;backdrop-filter:blur(3px);border-radius:4px;
}
.overlay.on{opacity:1;pointer-events:auto}
.overlay h2{font-size:44px;margin-bottom:8px;font-weight:900}
.overlay .sub{color:#aaa;font-size:15px;margin-bottom:2px}
.overlay .info{color:#888;font-size:13px;margin-top:4px}
.btn{
  margin-top:16px;padding:12px 44px;font-size:16px;font-weight:700;
  background:linear-gradient(135deg,#e94560,#c0392b);color:#fff;
  border:none;border-radius:8px;cursor:pointer;letter-spacing:2px;
  box-shadow:0 4px 20px rgba(233,69,96,0.4);transition:all 0.15s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(233,69,96,0.6)}
.btn:active{transform:translateY(0)scale(0.97)}
.controls{
  display:flex;justify-content:space-between;width:780px;padding:0 10px;
  color:#555;font-size:12px;
}
.controls kbd{
  background:#1e1e30;color:#f5c842;padding:1px 6px;border-radius:3px;
  border:1px solid #333;font-size:11px;font-family:inherit;
}
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="header">
    <h1>⚔ 坦克大战</h1>
    <div class="stats">
      <div class="stat"><span class="l">得分</span><span class="v" id="scr">0</span></div>
      <div class="stat"><span class="l">生命</span><span class="v" id="liv">3</span></div>
      <div class="stat"><span class="l">火力</span><span class="v" id="fp">⭐</span></div>
      <div class="stat"><span class="l">关卡</span><span class="v" id="lv">1</span></div>
    </div>
  </div>
  <div class="game-container">
    <canvas id="gc" width="780" height="780"></canvas>

    <div class="overlay on" id="menuOv">
      <h2 style="color:#e94560;">坦 克 大 战</h2>
      <div class="sub">⚔ 经典复刻 ⚔</div>
      <div class="info"><kbd>↑↓←→</kbd> 移动 · <kbd>空格</kbd> 射击 · <kbd>P</kbd> 暂停</div>
      <div class="info" style="font-size:11px;color:#555">最高分: <span id="hiSc">0</span></div>
      <button class="btn" id="startBtn">开 始 游 戏</button>
    </div>

    <div class="overlay" id="goOv">
      <h2 id="goTitle" style="font-size:40px;">💀 游戏结束</h2>
      <div class="sub" id="goMsg"></div>
      <div class="info" id="hsMsg" style="color:#f5c842"></div>
      <button class="btn" id="restartBtn">重新开始</button>
      <button class="btn" style="margin-top:8px;padding:8px 30px;font-size:13px;background:linear-gradient(135deg,#555,#333);box-shadow:none" id="menuBtn">主菜单</button>
    </div>

    <div class="overlay" id="lvlOv">
      <h2 style="color:#f5c842;font-size:36px;" id="lvlTitle">第 1 关</h2>
      <div class="sub">准备战斗！</div>
    </div>
  </div>
  <div class="controls">
    <span><kbd>↑↓←→</kbd> 移动 · <kbd>空格</kbd> 射击 · <kbd>P</kbd> 暂停</span>
    <span>消灭所有敌人 · 保卫基地</span>
  </div>
</div>

<script>
// ================================================================
//  CONSTANTS
// ================================================================
const C=26,R=26,S=30;
const E=0,B=1,T=2,A=3,W=4;  // Empty,Brick,Steel,Base,Water
const U=0,Ri=1,D=2,L=3;      // Up,Right,Down,Left
const DX=[0,1,0,-1],DY=[-1,0,1,0];

const $=id=>document.getElementById(id);
const cx=$('gc'),ctx=cx.getContext('2d');
const sc=$('scr'),li=$('liv'),fp=$('fp'),lv=$('lv');
const mOv=$('menuOv'),gOv=$('goOv'),lOv=$('lvlOv');

// ================================================================
//  AUDIO
// ================================================================
let ac=null;
function ai(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)()}
function as(f,d){try{ai();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*0.3,ac.currentTime+d);g.gain.setValueAtTime(0.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function ashoot(){as(800,0.08)}
function aexp(){try{ai();const b=ac.createBuffer(1,ac.sampleRate*0.3,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.setValueAtTime(0.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.3);s.connect(g);g.connect(ac.destination);s.start()}catch(e){}}
function apow(){try{ai();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(400,ac.currentTime);o.frequency.exponentialRampToValueAtTime(1200,ac.currentTime+0.2);g.gain.setValueAtTime(0.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.25);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.25)}catch(e){}}
function ago(){try{ai();const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(500,ac.currentTime);o.frequency.exponentialRampToValueAtTime(80,ac.currentTime+0.8);g.gain.setValueAtTime(0.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.8);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.8)}catch(e){}}
function awin(){try{ai();[523,659,784,1047].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,ac.currentTime+i*0.1);g.gain.setValueAtTime(0.1,ac.currentTime+i*0.1);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.1+0.2);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*0.1);o.stop(ac.currentTime+i*0.1+0.2)})}catch(e){}}

// ================================================================
//  RNG
// ================================================================
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ================================================================
//  MAP
// ================================================================
function buildMap(level){
  const m=[];for(let r=0;r<R;r++){m[r]=[];for(let c=0;c<C;c++)m[r][c]=E}
  // border
  for(let c=0;c<C;c++){m[0][c]=T;m[R-1][c]=T}
  for(let r=0;r<R;r++){m[r][0]=T;m[r][C-1]=T}
  // inner steel ring
  for(let c=0;c<C;c++){m[2][c]=T;m[R-3][c]=T}
  for(let r=0;r<R;r++){m[r][2]=T;m[r][C-3]=T}

  const seed=level*137+level*level*13,rn=rng(seed);

  // base
  const br=R-4,bc=Math.floor(C/2)-1;
  m[br][bc]=A;m[br][bc+1]=A;
  m[br+1][bc]=A;m[br+1][bc+1]=A;
  // base bricks
  for(let dr=-2;dr<=3;dr++)for(let dc=-2;dc<=3;dc++){
    if(dr>=-1&&dr<=1&&dc>=-1&&dc<=1)continue;
    const rr=br+dr,cc=bc+dc;
    if(rr>0&&rr<R-1&&cc>0&&cc<C-1&&m[rr][cc]===E)m[rr][cc]=B;
  }

  // bricks
  for(let r=5;r<R-6;r+=2)for(let c=5;c<C-5;c+=2){
    if(Math.abs(r-br)<4&&Math.abs(c-bc)<4)continue;
    if(rn()<0.22){
      m[r][c]=B;if(c+1<C-3)m[r][c+1]=B;
      if(rn()<0.3&&r+1<R-3)m[r+1][c]=B;
    }else if(rn()<0.05){
      m[r][c]=T;
    }
  }

  // water (level 2+)
  if(level>=2){
    for(let r=6;r<R-6;r+=3)for(let c=5;c<C-5;c+=4){
      if(Math.abs(r-br)<4&&Math.abs(c-bc)<4)continue;
      if(rn()<0.12){m[r][c]=W;m[r][c+1]=W;m[r+1][c]=W;m[r+1][c+1]=W}
    }
  }

  // clear spawns
  const px=Math.floor(C/2),py=R-8;
  for(let dr=0;dr<2;dr++)for(let dc=-3;dc<4;dc++){
    if(py+dr>0&&py+dr<R-1&&px+dc>0&&px+dc<C-1)m[py+dr][px+dc]=E;
  }
  // enemy spawns (top)
  for(let dc=-2;dc<=2;dc++){m[4][Math.floor(C/2)+dc]=E;m[4][Math.floor(C/2)+dc]=E}
  for(let dc=0;dc<3;dc++){m[4][dc+1]=E;m[4][C-2-dc]=E}
  return m;
}

// ================================================================
//  TANK
// ================================================================
class Tank{
  constructor(x,y,dir,isPlayer,etype='basic'){
    this.x=x;this.y=y;this.dir=dir;this.isPlayer=isPlayer;
    this.size=28;this.speed=isPlayer?2.5:1.2;this.hp=isPlayer?3:1;this.maxHp=this.hp;
    this.cooldown=0;this.maxCooldown=isPlayer?12:40;
    this.alive=true;this.fireLevel=isPlayer?1:1;
    this.shield=isPlayer?120:0;this.etype=etype;
    if(!isPlayer){
      const t={basic:{hp:1,speed:1.0,cd:40,color:'#aaa',sc:100},fast:{hp:1,speed:2.2,cd:35,color:'#e74c3c',sc:150},heavy:{hp:3,speed:0.8,cd:50,color:'#2ecc71',sc:250},boss:{hp:6,speed:0.6,cd:25,color:'#2c3e50',sc:500}};
      const d=t[etype]||t.basic;this.hp=d.hp;this.maxHp=d.hp;this.speed=d.speed;this.maxCooldown=d.cd;this.scr=d.sc;this.col=d.color;
    }
  }
  get cx(){return this.x+this.size/2}
  get cy(){return this.y+this.size/2}
  rect(){return{x:this.x,y:this.y,w:this.size,h:this.size}}
}

// ================================================================
//  BULLET
// ================================================================
class Bullet{
  constructor(x,y,dir,owner,lvl=1){
    this.x=x;this.y=y;this.dir=dir;this.owner=owner;
    this.s=6;this.sp=5+(owner.isPlayer?lvl-1:0)*0.5;
    this.alive=true;this.dmg=lvl>=3?2:1;
  }
  rect(){return{x:this.x,y:this.y,w:this.s,h:this.s}}
}

// ================================================================
//  PARTICLE
// ================================================================
let parts=[];
class Part{
  constructor(x,y,c,o={}){
    this.x=x;this.y=y;this.c=c;
    this.vx=o.vx||(Math.random()-0.5)*4;this.vy=o.vy||(Math.random()-0.5)*4;
    this.l=o.l||20+Math.random()*20;this.ml=this.l;
    this.s=o.s||2+Math.random()*3;this.g=o.g||0.03;this.f=o.f||0.97;this.alive=true;
  }
  upd(){this.vx*=this.f;this.vy*=this.f;this.vy+=this.g;this.x+=this.vx;this.y+=this.vy;this.l--;if(this.l<=0)this.alive=false}
  dr(ctx){const a=this.l/this.ml;ctx.globalAlpha=a;ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.s*a,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
}
function boom(x,y,n=20){
  const cs=['#ff4400','#ff8800','#ffcc00','#fff'];
  for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=1+Math.random()*4;parts.push(new Part(x,y,cs[Math.floor(Math.random()*cs.length)],{vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,gl:true,g:0.02}))}
}

// ================================================================
//  POWERUPS
// ================================================================
const PU_TYPES=[
  {t:'star',ic:'⭐',co:'#f5c842',de:'火力升级'},
  {t:'shield',ic:'🛡️',co:'#3498db',de:'护盾'},
  {t:'speed',ic:'⚡',co:'#2ecc71',de:'加速'},
  {t:'bomb',ic:'💣',co:'#e74c3c',de:'全屏炸弹'},
  {t:'life',ic:'❤️',co:'#e94560',de:'额外生命'},
];
class PowerUp{
  constructor(x,y,t){this.x=x;this.y=y;this.t=t;this.alive=true;this.tm=600;this.bb=0}
}

// ================================================================
//  GAME STATE
// ================================================================
let G=null;

// ================================================================
//  INPUT
// ================================================================
const K={};
document.addEventListener('keydown',e=>{
  K[e.key]=true;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','p','P'].includes(e.key))e.preventDefault();
  if((e.key==='p'||e.key==='P')&&G&&G.st==='play')G.st='pause';
  else if((e.key==='p'||e.key==='P')&&G&&G.st==='pause')G.st='play';
});
document.addEventListener('keyup',e=>{K[e.key]=false});

// ================================================================
//  COLLISION
// ================================================================
function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function canMove(tk,nx,ny,ts){
  const tr={x:nx,y:ny,w:tk.size,h:tk.size};
  if(nx<0||ny<0||nx+tk.size>C*S||ny+tk.size>R*S)return false;
  const sc=Math.max(0,Math.floor(nx/S)),ec=Math.min(C-1,Math.floor((nx+tk.size-1)/S));
  const sr=Math.max(0,Math.floor(ny/S)),er=Math.min(R-1,Math.floor((ny+tk.size-1)/S));
  for(let rr=sr;rr<=er;rr++)for(let cc=sc;cc<=ec;cc++){
    if(G.map[rr][cc]===B||G.map[rr][cc]===T||G.map[rr][cc]===A||G.map[rr][cc]===W)
      if(ov(tr,{x:cc*S,y:rr*S,w:S,h:S}))return false;
  }
  for(const o of ts){if(o===tk||!o.alive)continue;if(ov(tr,{x:o.x,y:o.y,w:o.size,h:o.size}))return false}
  return true;
}

// ================================================================
//  INIT
// ================================================================
function init(lv=1){
  parts.length=0;
  const map=buildMap(lv);
  const px=Math.floor(C/2)*S+1,py=(R-9)*S+1;
  const pl=new Tank(px,py,U,true);
  const es=[];const eSps=[{x:Math.floor(C/2)*S+1,y:5*S+1},{x:2*S+1,y:5*S+1},{x:(C-4)*S+1,y:5*S+1}];
  const nE=Math.min(6+lv,16);
  for(let i=0;i<nE;i++){
    const sp=eSps[i%3];const t=lv>=5&&Math.random()<0.08?'boss':lv>=3&&Math.random()<0.2?'heavy':lv>=2&&Math.random()<0.35?'fast':'basic';
    es.push(new Tank(sp.x,sp.y,D,false,t));
  }
  const sq=[];const tE=nE+1+Math.floor(lv/2);
  for(let i=nE;i<tE;i++){const sp=eSps[i%3];const t=lv>=5&&Math.random()<0.08?'boss':lv>=3&&Math.random()<0.2?'heavy':lv>=2&&Math.random()<0.35?'fast':'basic';sq.push({x:sp.x,y:sp.y,t})}
  G={
    map,pl,es,b:[],pu:[],sq,
    sc:0,hs:parseInt(localStorage.getItem('ths')||'0'),li:3,lv,st:'play',
    eK:0,eT:tE,spTm:0,fr:0,ba:true,
    co:0,coTm:0,shTm:0,shIn:0,
    pTm:500,th:lv%3,pRT:0,gt:0,lastW:false,
  };
  ui();
  lOv.classList.remove('on');
}

// ================================================================
//  UI
// ================================================================
function ui(){
  sc.textContent=G.sc;li.textContent=G.li;
  const stars='⭐'.repeat(Math.min(G.pl.fireLevel,3));
  fp.textContent=stars||'⭐';lv.textContent=G.lv;
}

// ================================================================
//  SPAWN BULLET
// ================================================================
function sb(tk){
  if(tk.cooldown>0)return;
  const cx=tk.x+14,cy=tk.y+14;
  const b=new Bullet(cx-3+DX[tk.dir]*14,cy-3+DY[tk.dir]*14,tk.dir,tk,tk.isPlayer?tk.fireLevel:1);
  G.b.push(b);
  tk.cooldown=tk.isPlayer?Math.max(6,12-tk.fireLevel*2):tk.maxCooldown;
  if(tk.isPlayer)ashoot();
}

// ================================================================
//  AI
// ================================================================
function ai_(tk){
  if(!G||tk.aiT===undefined)return;
  if(tk.aiT===undefined)tk.aiT=0;
  if(tk.aiDT===undefined)tk.aiDT=0;
  tk.aiT--;tk.aiDT--;
  const ax=tk.x+DX[tk.dir]*tk.size*0.6,ay=tk.y+DY[tk.dir]*tk.size*0.6;
  const can=canMove(tk,ax,ay,[tk,...G.es,G.pl].filter(t=>t.alive));
  if(!can||tk.aiDT<=0){
    const pl=G.pl;
    if(pl&&pl.alive&&Math.random()<0.4){
      const dx=pl.cx-tk.cx,dy=pl.cy-tk.cy;
      tk.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?Ri:L):(dy>0?D:U);
    }else{tk.dir=Math.floor(Math.random()*4)}
    tk.aiDT=30+Math.floor(Math.random()*60);
  }
  if(tk.aiT<=0){
    const nx=tk.x+DX[tk.dir]*tk.speed,ny=tk.y+DY[tk.dir]*tk.speed;
    if(canMove(tk,nx,ny,[tk,...G.es,G.pl].filter(t=>t.alive))){tk.x=nx;tk.y=ny}
    else tk.aiDT=0;
    tk.aiT=2;
  }
  if(Math.random()<0.03)sb(tk);
}

// ================================================================
//  UPDATE
// ================================================================
function upd(){
  if(!G||G.st!=='play')return;
  G.fr++;G.gt++;
  if(G.coTm>0)G.coTm--;else G.co=0;
  if(G.shTm>0)G.shTm--;
  if(G.pTm>0)G.pTm--;

  // player
  const pl=G.pl;
  if(pl.alive){
    if(pl.shield>0)pl.shield--;
    if(pl.cooldown>0)pl.cooldown--;
    let mv=false;
    if(K['ArrowUp']){pl.dir=U;mv=true}else if(K['ArrowDown']){pl.dir=D;mv=true}
    else if(K['ArrowLeft']){pl.dir=L;mv=true}else if(K['ArrowRight']){pl.dir=Ri;mv=true}
    if(mv){
      const nx=pl.x+DX[pl.dir]*pl.speed,ny=pl.y+DY[pl.dir]*pl.speed;
      if(canMove(pl,nx,ny,[pl,...G.es].filter(t=>t.alive))){pl.x=nx;pl.y=ny}
    }
    if(K[' '])sb(pl);
  }else if(G.pRT>0){
    G.pRT--;if(G.pRT===0){const p2=Math.floor(C/2)*S+1;pl.x=p2;pl.y=(R-9)*S+1;pl.dir=U;pl.alive=true;pl.shield=120;pl.cooldown=0}
  }

  // enemies
  for(const e of G.es){
    if(!e.alive)continue;if(e.cooldown>0)e.cooldown--;ai_(e);
  }

  // bullets
  for(const b of G.b){
    if(!b.alive)continue;
    b.x+=DX[b.dir]*b.sp;b.y+=DY[b.dir]*b.sp;
    if(b.x<-10||b.y<-10||b.x>C*S+10||b.y>R*S+10){b.alive=false;continue}
    // map hit
    const bc=Math.floor((b.x+3)/S),br=Math.floor((b.y+3)/S);
    if(bc>=0&&bc<C&&br>=0&&br<R){
      const tl=G.map[br][bc];
      if(tl===B){b.alive=false;G.map[br][bc]=E;boom(bc*S+15,br*S+15,10);continue}
      if(tl===T){b.alive=false;boom(bc*S+15,br*S+15,5);continue}
      if(tl===A){b.alive=false;G.map[br][bc]=E;G.ba=false;boom(bc*S+15,br*S+15,30);go(false);return}
    }
    // bullet vs bullet
    for(const ob of G.b){if(ob!==b&&ob.alive&&ov(b.rect(),ob.rect())){b.alive=false;ob.alive=false;boom((b.x+ob.x)/2,(b.y+ob.y)/2,8);break}}
  }

  // bullet vs tank
  for(const b of G.b){
    if(!b.alive)continue;
    if(b.owner.isPlayer){
      for(const e of G.es){
        if(!e.alive)continue;
        if(ov(b.rect(),e.rect())){
          b.alive=false;e.hp-=b.dmg;boom(e.cx,e.cy,8);
          if(e.hp<=0){
            e.alive=false;G.eK++;G.co++;G.coTm=120;
            const mult=Math.min(G.co,10);const pts=(e.scr||100)*mult;G.sc+=pts;
            boom(e.cx,e.cy,25);aexp();
            if(G.co>=3){} // combo
            // powerup drop
            if(Math.random()<0.2){const pt=PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)];G.pu.push(new PowerUp(e.x+14,e.y+14,pt.t))}
          }
          ui();break;
        }
      }
    }else{
      if(pl.alive&&ov(b.rect(),pl.rect())){
        b.alive=false;
        if(pl.shield>0){boom(pl.cx,pl.cy,8)}else{
          pl.alive=false;G.li--;boom(pl.cx,pl.cy,25);aexp();G.shTm=12;G.shIn=6;ui();
          if(G.li<=0){go(false);return}
          G.pRT=60;
        }
      }
    }
  }

  // cleanup
  G.b=G.b.filter(b=>b.alive);
  G.es=G.es.filter(e=>e.alive);
  parts=parts.filter(p=>p.alive);
  G.pu=G.pu.filter(p=>p.alive);

  // particles
  for(const p of parts)p.upd();

  // spawn enemies from queue
  if(G.es.length<4&&G.sq&&G.sq.length>0){
    if(G.spTm<=0){const s=G.sq.shift();const e=new Tank(s.x,s.y,D,false,s.t);G.es.push(e);G.spTm=90}
  }
  if(G.spTm>0)G.spTm--;

  // powerup spawn
  if(G.pTm<=0&&G.pu.length<2){
    let att=0;while(att<20){const cc=3+Math.floor(Math.random()*(C-6)),cr=3+Math.floor(Math.random()*(R-6));if(G.map[cr][cc]===E){G.pu.push(new PowerUp(cc*S+15,cr*S+15,PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)].t));break}att++}
    G.pTm=400+Math.floor(Math.random()*300);
  }

  // powerup timers + pickup
  for(const pu of G.pu){pu.bb+=0.05;pu.tm--;if(pu.tm<=0)pu.alive=false}
  if(pl.alive){
    for(const pu of G.pu){
      if(!pu.alive)continue;
      if(Math.abs(pl.cx-pu.x)<20&&Math.abs(pl.cy-pu.y)<20){
        const info=PU_TYPES.find(x=>x.t===pu.t);
        if(pu.t==='star')pl.fireLevel=Math.min(3,pl.fireLevel+1);
        else if(pu.t==='shield')pl.shield=300;
        else if(pu.t==='speed')pl.speed=4.5;
        else if(pu.t==='bomb'){G.es.forEach(e=>{if(e.alive){e.alive=false;G.eK++;G.sc+=e.scr||100;boom(e.cx,e.cy,15)}});G.b.forEach(b=>{if(!b.owner.isPlayer)b.alive=false})}
        else if(pu.t==='life')G.li=Math.min(5,G.li+1);
        pu.alive=false;apow();ui();break;
      }
    }
  }

  // win
  if(G.eK>=G.eT&&G.es.length===0&&(!G.sq||G.sq.length===0)){go(true);return}
}

// ================================================================
//  DRAW
// ================================================================
function dr(){
  if(!G)return;
  ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,780,780);

  // map
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const x=c*S,y=r*S,tl=G.map[r][c];
    if(tl===E){ctx.fillStyle=(r+c)%2===0?'#2a2a2a':'#222';ctx.fillRect(x,y,S,S)}
    else if(tl===B){
      ctx.fillStyle='#8B4513';ctx.fillRect(x,y,S,S);
      ctx.strokeStyle='#654321';ctx.lineWidth=0.5;ctx.strokeRect(x,y,S,S);
      ctx.strokeStyle='#A0522D';ctx.lineWidth=0.5;
      ctx.beginPath();ctx.moveTo(x,y+15);ctx.lineTo(x+S,y+15);ctx.moveTo(x+15,y);ctx.lineTo(x+15,y+15);
      ctx.moveTo(x+7,y+15);ctx.lineTo(x+7,y+S);ctx.moveTo(x+22,y+15);ctx.lineTo(x+22,y+S);ctx.stroke();
    }else if(tl===T){
      ctx.fillStyle='#555';ctx.fillRect(x,y,S,S);ctx.fillStyle='#666';ctx.fillRect(x+1,y+1,S-2,S-2);
      ctx.strokeStyle='#777';ctx.lineWidth=0.5;
      ctx.strokeRect(x+3,y+3,11,11);ctx.strokeRect(x+16,y+3,11,11);
      ctx.strokeRect(x+3,y+16,11,11);ctx.strokeRect(x+16,y+16,11,11);
    }else if(tl===A){
      ctx.fillStyle='#333';ctx.fillRect(x,y,S,S);
      ctx.fillStyle='#f5c842';ctx.beginPath();ctx.arc(x+15,y+15,10,0,6.28);ctx.fill();
      ctx.fillStyle='#e94560';ctx.font='18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',x+15,y+15);
    }else if(tl===W){
      ctx.fillStyle='#1a5276';ctx.fillRect(x,y,S,S);
      ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(x+2,y+10+Math.sin(G.fr*0.03+r*0.5+c*0.7)*3,S-4,3);
      ctx.fillRect(x+2,y+20-Math.sin(G.fr*0.03+r*0.5+c*0.7)*3,S-4,2);
    }
  }

  // powerups
  for(const pu of G.pu){
    if(!pu.alive)continue;
    const info=PU_TYPES.find(x=>x.t===pu.t);if(!info)continue;
    const by=Math.sin(pu.bb)*3;const al=pu.tm<120?(pu.tm%12<6?0.5:1):1;
    ctx.globalAlpha=al;ctx.shadowBlur=12;ctx.shadowColor=info.co;
    ctx.fillStyle=info.co+'44';ctx.beginPath();ctx.arc(pu.x,pu.y+by,14,0,6.28);ctx.fill();
    ctx.shadowBlur=0;ctx.font='18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(info.ic,pu.x,pu.y+by+1);
    ctx.globalAlpha=1;
  }

  // tanks
  tank(G.pl);
  for(const e of G.es){if(e.alive)tank(e)}

  // bullets
  for(const b of G.b){
    const ip=b.owner.isPlayer;
    ctx.shadowBlur=10;ctx.shadowColor=ip?'#ff0':'#f44';
    const gr=ctx.createRadialGradient(b.x+3,b.y+3,0,b.x+3,b.y+3,4);
    if(ip){gr.addColorStop(0,'#fff');gr.addColorStop(0.3,'#ff0');gr.addColorStop(1,'rgba(255,200,0,0)')}
    else{gr.addColorStop(0,'#fff');gr.addColorStop(0.3,'#f44');gr.addColorStop(1,'rgba(255,0,0,0)')}
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(b.x+3,b.y+3,4,0,6.28);ctx.fill();ctx.shadowBlur=0;
  }

  // particles
  for(const p of parts)p.dr(ctx);

  // minimap
  const ms=120/(C*S);
  mCtx.fillStyle='rgba(0,0,0,0.7)';mCtx.fillRect(0,0,120,120);
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const tl=G.map[r][c];
    if(tl===B){mCtx.fillStyle='#8B4513';mCtx.fillRect(c*ms,r*ms,ms+0.5,ms+0.5)}
    else if(tl===T){mCtx.fillStyle='#708090';mCtx.fillRect(c*ms,r*ms,ms+0.5,ms+0.5)}
    else if(tl===A){mCtx.fillStyle='#f5c842';mCtx.fillRect(c*ms,r*ms,ms+0.5,ms+0.5)}
    else if(tl===W){mCtx.fillStyle='#1a5276';mCtx.fillRect(c*ms,r*ms,ms+0.5,ms+0.5)}
  }
  if(G.pl.alive){mCtx.fillStyle='#4a90d9';mCtx.beginPath();mCtx.arc(G.pl.cx*ms,G.pl.cy*ms,3,0,6.28);mCtx.fill()}
  mCtx.fillStyle='#e74c3c';
  for(const e of G.es){if(e.alive){mCtx.beginPath();mCtx.arc(e.cx*ms,e.cy*ms,2,0,6.28);mCtx.fill()}}

  // shield
  const pl=G.pl;
  if(pl.alive&&pl.shield>0){
    ctx.shadowBlur=15;ctx.shadowColor='#3498db';
    ctx.strokeStyle='rgba(52,152,219,'+(0.4+Math.sin(G.fr*0.08)*0.2)+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(pl.cx,pl.cy,20,0,6.28);ctx.stroke();ctx.shadowBlur=0;
  }

  // pause overlay
  if(G.st==='pause'){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,780,780);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⏸ 暂停',390,360);ctx.fillStyle='#888';ctx.font='16px Arial';ctx.fillText('按 P 继续',390,420);
  }
}

// ================================================================
//  TANK SPRITE
// ================================================================
function tank(tk){
  const x=tk.x,y=tk.y,ip=tk.isPlayer,s=28,cx=x+14,cy=y+14;
  let bc,bl,tc,bc2,ac;
  if(ip){bc='#4a90d9';bl='#5ba0e8';tc='#3a7bc8';bc2='#2c5f8a';ac='#7bb8f0'}
  else{bc=tk.col||'#aaa';bl=tk.col||'#888';tc='#666';bc2='#444';ac='#888'}

  // tracks
  ctx.fillStyle=tc;ctx.fillRect(x,y+2,s,3);ctx.fillRect(x,y+s-5,s,3);
  const mo=ip?Math.floor(G.fr*0.3)%6:Math.floor(G.fr*0.2)%6;
  ctx.fillStyle=ip?'#3a6fa8':'#555';
  for(let i=0;i<7;i++){const ty=(i*4+mo)%(s-4)+2;ctx.fillRect(x,ty,3,2);ctx.fillRect(x+s-3,ty,3,2)}

  // body
  ctx.fillStyle=bc;ctx.fillRect(x+3,y+3,s-6,s-6);
  ctx.fillStyle=bl;ctx.fillRect(x+4,y+4,s-8,2);ctx.fillRect(x+4,y+4,2,s-8);

  // turret
  ctx.fillStyle=tc;ctx.beginPath();ctx.arc(cx,cy,7,0,6.28);ctx.fill();

  // barrel
  ctx.fillStyle=bc2;const bw=4,bl2=12;
  let bx=0,by=0,rx=0,ry=0;
  switch(tk.dir){case U:bx=cx-bw/2;by=cy-bl2;rx=bw;ry=bl2;break;case D:bx=cx-bw/2;by=cy;rx=bw;ry=bl2;break;case L:bx=cx-bl2;by=cy-bw/2;rx=bl2;ry=bw;break;case Ri:bx=cx;by=cy-bw/2;rx=bl2;ry=bw;break}
  ctx.fillRect(bx,by,rx,ry);

  // dots
  ctx.fillStyle=ip?'rgba(255,255,255,0.3)':'rgba(255,255,255,0.2)';
  ctx.beginPath();ctx.arc(cx-3,cy-3,2,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(cx+3,cy+3,2,0,6.28);ctx.fill();

  // HP bar (enemy)
  if(!ip&&tk.hp>1){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(cx-11,y-6,22,5);
    ctx.fillStyle='#e74c3c';ctx.fillRect(cx-10,y-5,20*(tk.hp/tk.maxHp),3);
  }
  // HP bar (player)
  if(ip){
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(cx-13,y+s+2,26,5);
    ctx.fillStyle=tk.hp>1?'#2ecc71':'#e74c3c';ctx.fillRect(cx-12,y+s+3,24*(tk.hp/tk.maxHp),3);
  }
}

// ================================================================
//  GAME OVER
// ================================================================
function go(win){
  if(!G||G.st!=='play')return;
  G.st='go';G.lastW=win;
  const ph=parseInt(localStorage.getItem('ths')||'0');
  if(G.sc>ph)localStorage.setItem('ths',G.sc.toString());
  if(win){
    $('goTitle').textContent='🎉 胜利！';$('goTitle').style.color='#f5c842';
    $('restartBtn').textContent='下一关 ➜';awin();
  }else{
    $('goTitle').textContent='💀 游戏结束';$('goTitle').style.color='#e94560';
    $('restartBtn').textContent='重新开始';ago();
  }
  $('goMsg').textContent=`得分: ${G.sc} · 消灭: ${G.eK} · 关卡: ${G.lv}`;
  $('hsMsg').textContent=G.sc>=ph?'🏆 新纪录！':'最高分: '+Math.max(ph,G.sc);
  gOv.classList.add('on');
}

// ================================================================
//  MINIMAP CANVAS
// ================================================================
const mc=document.createElement('canvas');
mc.width=120;mc.height=120;mc.style.cssText='position:absolute;top:6px;right:6px;border:1px solid rgba(255,255,255,0.15);border-radius:3px;pointer-events:none;z-index:5';
document.querySelector('.game-container').appendChild(mc);
const mCtx=mc.getContext('2d');

// ================================================================
//  GAME LOOP
// ================================================================
function loop(){
  upd();
  dr();
  requestAnimationFrame(loop);
}

// ================================================================
//  BUTTONS
// ================================================================
$('startBtn').addEventListener('click',()=>{
  mOv.classList.remove('on');
  lOv.classList.add('on');
  $('lvlTitle').textContent='第 1 关';
  init(1);
});
$('restartBtn').addEventListener('click',()=>{
  gOv.classList.remove('on');
  if(G&&G.lastW){init(G.lv+1)}else{init(1)}
});
$('menuBtn').addEventListener('click',()=>{
  gOv.classList.remove('on');mOv.classList.add('on');
  G=null;
});

// ================================================================
//  START
// ================================================================
$('hiSc').textContent=localStorage.getItem('ths')||'0';
mOv.classList.add('on');
G=null;
loop();
</script>
